<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة التطبيق - Services App Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #e0e5ec;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: black;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2), 0 0 0 10px #333;
            position: relative;
            overflow: hidden;
            border: 8px solid #333;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #333;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            border-radius: 32px;
        }

        .controls {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: white;
            border: none;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .hint {
            position: absolute;
            bottom: 30px;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="phone-frame">
        <div class="notch"></div>
        <iframe src="index.html" id="app-frame"></iframe>
    </div>

    <div class="controls">
        <button class="btn" onclick="document.getElementById('app-frame').contentWindow.location.reload()"
            title="إعادة تشغيل"><i class="fas fa-redo"></i></button>
        <button class="btn" onclick="toggleTheme()" title="تغيير الخلفية"><i class="fas fa-adjust"></i></button>
    </div>

    <div class="hint">اضغط F11 لتجربة وضع ملء الشاشة</div>

    <script>
        function toggleTheme() {
            document.body.style.background = document.body.style.background === 'rgb(30, 30, 30)' ? '#e0e5ec' : '#1e1e1e';
        }
    </script>
</body>

</html>
